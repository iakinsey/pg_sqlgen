[package]
name = "sqlgen"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_sqlgen"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg_test = []

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
hf-hub = "0.4.3"
httpmock = "0.7.0"
pgrx = "=0.16.0"
reqwest = "0.12.23"
serde = "1.0.220"
serde_json = "1.0.143"
tera = "1.20.0"
thiserror = "2.0.16"
tokenizers = "0.22.0"
tokio = "1.47.1"
uuid = "1.18.1"

[dev-dependencies]
pgrx-tests = "=0.16.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
